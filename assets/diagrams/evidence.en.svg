<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486" role="img" aria-labelledby="title desc">
<title id="title">Follow the relationship. Open the source.</title><desc id="desc">Follow the relationship. Open the source.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192f"/><stop offset="1" stop-color="#211b41"/></linearGradient>
  <linearGradient id="glow"><stop stop-color="#59c9d0"/><stop offset="1" stop-color="#b89bff"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#8d9bcc" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="486" rx="24" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="42" y="55" font-size="30" fill="#f2f4ff" font-weight="650">Follow the relationship. Open the source.</text><rect x="42" y="107" width="203" height="105" rx="16" fill="#151e37" stroke="#334269"/><rect x="42" y="126" width="3" height="28" fill="#9291ff"/><text x="60" y="150" font-size="21" fill="#f1f3ff" font-weight="600">Page</text><text x="60" y="182" font-size="15" fill="#aab6d8" font-weight="400">/settings</text><path d="M249 156 L264 156" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="272" y="107" width="203" height="105" rx="16" fill="#151e37" stroke="#334269"/><rect x="272" y="126" width="3" height="28" fill="#9291ff"/><text x="290" y="150" font-size="21" fill="#f1f3ff" font-weight="600">Feature</text><text x="290" y="182" font-size="15" fill="#aab6d8" font-weight="400">human mapping</text><path d="M479 156 L494 156" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="502" y="107" width="203" height="105" rx="16" fill="#151e37" stroke="#334269"/><rect x="502" y="126" width="3" height="28" fill="#9291ff"/><text x="520" y="150" font-size="21" fill="#f1f3ff" font-weight="600">Method</text><text x="520" y="182" font-size="15" fill="#aab6d8" font-weight="400">saveSettings</text><path d="M709 156 L724 156" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="732" y="107" width="203" height="105" rx="16" fill="#151e37" stroke="#334269"/><rect x="732" y="126" width="3" height="28" fill="#9291ff"/><text x="750" y="150" font-size="21" fill="#f1f3ff" font-weight="600">Contract</text><text x="750" y="182" font-size="15" fill="#aab6d8" font-weight="400">Settings</text><path d="M939 156 L954 156" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="962" y="107" width="203" height="105" rx="16" fill="#151e37" stroke="#334269"/><rect x="962" y="126" width="3" height="28" fill="#9291ff"/><text x="980" y="150" font-size="21" fill="#f1f3ff" font-weight="600">Data operation</text><text x="980" y="182" font-size="15" fill="#aab6d8" font-weight="400">UPDATE preferences</text><text x="42" y="253" font-size="17" fill="#aab6d8" font-weight="400">Conceptual view — each relation has its own meaning, not a runtime sequence.</text><rect x="42" y="289" width="548" height="116" rx="16" fill="#151e37" stroke="#334269"/><rect x="42" y="308" width="3" height="28" fill="#66d7d1"/><text x="60" y="332" font-size="21" fill="#f1f3ff" font-weight="600">Source anchor</text><text x="60" y="364" font-size="15" fill="#aab6d8" font-weight="400">snapshot · commit · file · line · rule</text><rect x="610" y="289" width="548" height="116" rx="16" fill="#151e37" stroke="#334269"/><rect x="610" y="308" width="3" height="28" fill="#bd9cff"/><text x="628" y="332" font-size="21" fill="#f1f3ff" font-weight="600">Keep uncertainty visible</text><text x="628" y="364" font-size="15" fill="#aab6d8" font-weight="400">resolved  /  candidate  /  unresolved</text><text x="42" y="446" font-size="20" fill="#d7def8" font-weight="400">A candidate path suggests possible impact. It does not prove execution.</text>
</g></svg>
