<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">The workflow changed. The need to understand did not.</title><desc id="desc">Two development workflows, not a productivity benchmark.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192f"/><stop offset="1" stop-color="#211b41"/></linearGradient>
  <linearGradient id="glow"><stop stop-color="#59c9d0"/><stop offset="1" stop-color="#b89bff"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#8d9bcc" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="470" rx="24" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="42" y="55" font-size="29" fill="#f2f4ff" font-weight="650">The workflow changed. The need to understand did not.</text><text x="42" y="103" font-size="17" fill="#a8b6e8" font-weight="400">THEN / human-led</text><rect x="42" y="126" width="252" height="91" rx="16" fill="#151e37" stroke="#334269"/><rect x="42" y="145" width="3" height="28" fill="#9291ff"/><text x="60" y="169" font-size="21" fill="#f1f3ff" font-weight="600">Intent</text><path d="M300 170 L320 170" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="329" y="126" width="252" height="91" rx="16" fill="#151e37" stroke="#334269"/><rect x="329" y="145" width="3" height="28" fill="#9291ff"/><text x="347" y="169" font-size="21" fill="#f1f3ff" font-weight="600">Design</text><path d="M587 170 L607 170" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="616" y="126" width="252" height="91" rx="16" fill="#151e37" stroke="#334269"/><rect x="616" y="145" width="3" height="28" fill="#9291ff"/><text x="634" y="169" font-size="21" fill="#f1f3ff" font-weight="600">Write code</text><path d="M874 170 L894 170" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="903" y="126" width="252" height="91" rx="16" fill="#151e37" stroke="#334269"/><rect x="903" y="145" width="3" height="28" fill="#9291ff"/><text x="921" y="169" font-size="21" fill="#f1f3ff" font-weight="600">Test &amp; review</text><text x="42" y="266" font-size="17" fill="#66d7d1" font-weight="400">NOW / agent-assisted</text><rect x="42" y="288" width="252" height="91" rx="16" fill="#151e37" stroke="#334269"/><rect x="42" y="307" width="3" height="28" fill="#66d7d1"/><text x="60" y="331" font-size="21" fill="#f1f3ff" font-weight="600">Intent</text><path d="M300 332 L320 332" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="329" y="288" width="252" height="91" rx="16" fill="#151e37" stroke="#334269"/><rect x="329" y="307" width="3" height="28" fill="#66d7d1"/><text x="347" y="331" font-size="21" fill="#f1f3ff" font-weight="600">Agent builds</text><path d="M587 332 L607 332" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="616" y="288" width="252" height="91" rx="16" fill="#151e37" stroke="#334269"/><rect x="616" y="307" width="3" height="28" fill="#66d7d1"/><text x="634" y="331" font-size="21" fill="#f1f3ff" font-weight="600">Many-file changes</text><path d="M874 332 L894 332" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="903" y="288" width="252" height="91" rx="16" fill="#151e37" stroke="#334269"/><rect x="903" y="307" width="3" height="28" fill="#66d7d1"/><text x="921" y="331" font-size="21" fill="#f1f3ff" font-weight="600">You verify</text><text x="42" y="430" font-size="22" fill="#e2d7ff" font-weight="400">What changed? Why? What could it affect? Where is the evidence?</text>
</g></svg>
