<text x="42" y="55" font-size="30" fill="#f2f4ff" font-weight="650">Local facts first. Optional explanations second.</text><rect x="30" y="91" width="1140" height="341" rx="18" fill="none" stroke="#66d7d1" stroke-dasharray="7 6"/><text x="50" y="122" font-size="17" fill="#66d7d1" font-weight="400">YOUR LOCAL ENVIRONMENT · target architecture</text><rect x="50" y="150" width="252" height="95" rx="16" fill="#151e37" stroke="#334269"/><rect x="50" y="169" width="3" height="28" fill="#9291ff"/><text x="68" y="193" font-size="21" fill="#f1f3ff" font-weight="600">Git snapshot</text><path d="M307 195 L325 195" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="330" y="150" width="252" height="95" rx="16" fill="#151e37" stroke="#334269"/><rect x="330" y="169" width="3" height="28" fill="#9291ff"/><text x="348" y="193" font-size="21" fill="#f1f3ff" font-weight="600">Parser + rules</text><path d="M587 195 L605 195" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="610" y="150" width="252" height="95" rx="16" fill="#151e37" stroke="#334269"/><rect x="610" y="169" width="3" height="28" fill="#9291ff"/><text x="628" y="193" font-size="21" fill="#f1f3ff" font-weight="600">Evidence + limits</text><path d="M876 195 L916 195" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="924" y="150" width="224" height="95" rx="16" fill="#151e37" stroke="#334269"/><rect x="924" y="169" width="3" height="28" fill="#9291ff"/><text x="942" y="193" font-size="21" fill="#f1f3ff" font-weight="600">Human review</text><path d="M744 250 L744 288" stroke="#8d9bcc" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 7"/><rect x="610" y="300" width="538" height="104" rx="16" fill="#151e37" stroke="#334269"/><rect x="610" y="319" width="3" height="28" fill="#bd9cff"/><text x="628" y="343" font-size="21" fill="#f1f3ff" font-weight="600">Local model · planned integration</text><text x="628" y="375" font-size="15" fill="#aab6d8" font-weight="400">Read selected evidence; never rewrite facts.</text><text x="50" y="334" font-size="20" fill="#d7def8" font-weight="400">No target code execution.</text><text x="50" y="371" font-size="20" fill="#d7def8" font-weight="400">No code upload by default.</text><text x="42" y="474" font-size="20" fill="#aab6d8" font-weight="400">Future remote providers require explicit, per-analysis data authorization.</text>
