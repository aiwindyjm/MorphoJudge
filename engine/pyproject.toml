[project]
name = "morphojudge-engine"
version = "0.1.0"
description = "MorphoJudge local analysis daemon (Batch-01 skeleton: contracts, snapshot, diff, selection)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "tree-sitter==0.25.2",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.23.1",
    "tree-sitter-python==0.23.6",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "jsonschema==4.23.0",
]

[tool.pytest.ini_options]
# 测试在 Docker 内以只读源码挂载运行：禁用缓存写入，避免只读卷失败。
addopts = "-p no:cacheprovider -q"
testpaths = ["tests"]
